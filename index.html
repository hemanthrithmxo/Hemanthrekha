<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fbf7ed">
<meta name="description" content="Hemanth and Rekha wedding invitation">
<title>Hemanth & Rekha | Wedding Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8f1df;color:#29241f;padding:24px}
.cover{position:relative;width:min(100%,680px);min-height:min(calc(100vh - 48px),1140px);display:flex;align-items:center;justify-content:center;text-align:center;padding:48px 24px;background:radial-gradient(ellipse at center,#fffefa 0%,#fffdf7 48%,#fbf5e8 100%);border:2px solid #e8d9ac;border-radius:5px}
.cover:before{content:"";position:absolute;inset:9px;border:1px solid #eee3c5;pointer-events:none}
.inner{position:relative;z-index:1;width:100%;max-width:540px}
.ornament{display:flex;align-items:center;justify-content:center;gap:12px;color:#c6a53e;margin:0 auto 36px}
.ornament:before,.ornament:after{content:"";width:24px;height:1px;background:#d9c16f}
.diamond{width:13px;height:25px;background:#c6a53e;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.eyebrow{font:600 12px Arial,sans-serif;letter-spacing:.32em;color:#a98527;margin:0 0 34px}
.name{font-weight:400;font-size:clamp(38px,8vw,60px);line-height:1.14;margin:0;overflow-wrap:anywhere}
.amp{font-size:42px;font-style:italic;color:#c6a53e;margin:7px 0}
.rule{height:1px;width:90px;background:linear-gradient(90deg,transparent,#c6a53e,transparent);margin:38px auto 30px}
.date{font:500 clamp(18px,4.2vw,25px) Arial,sans-serif;margin:0 0 15px}
.venue{font:clamp(16px,3.8vw,21px) Arial,sans-serif;color:#827b70;margin:0}
.open{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;width:min(100%,410px);min-height:155px;margin:64px auto 0;border:2px solid #dfc875;border-radius:100px;background:linear-gradient(135deg,#fffdf8,#fbf5e8);box-shadow:0 10px 22px #c9ad4b24;color:#2c2922;text-decoration:none;font:600 18px Arial,sans-serif;letter-spacing:.24em;transition:transform .2s,box-shadow .2s}
.open:hover,.open:focus-visible{transform:translateY(-3px);box-shadow:0 13px 26px #c9ad4b3b;outline:none}
.envelope{width:36px;height:30px;color:#c6a53e}
@media(max-width:420px){body{padding:12px}.cover{min-height:calc(100vh - 24px);padding:35px 20px}.eyebrow{letter-spacing:.24em;margin-bottom:28px}.rule{margin:30px auto 25px}.open{margin-top:48px;min-height:135px;font-size:16px}}

.music-toggle{position:absolute;right:22px;top:22px;z-index:3;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid #dfc875;border-radius:999px;background:#fffdf2;color:#8d6e20;font:600 12px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 12px #c9ad4b18}
.music-toggle:hover{background:#fff8df}
.music-toggle svg{width:16px;height:16px}
@media(max-width:420px){.music-toggle{top:16px;right:16px;padding:9px 11px;font-size:11px}}


.music-toggle{position:fixed;right:16px;top:16px;z-index:20;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid #d7b66e;border-radius:999px;background:rgba(255,249,239,.97);color:#8d641b;font:600 12px Arial,sans-serif;cursor:pointer;box-shadow:0 4px 12px rgba(80,55,20,.12)}
.music-toggle:hover{background:#fff1d8}
.music-toggle:focus-visible{outline:2px solid #a96d16;outline-offset:3px}
.music-player{position:fixed;right:16px;top:62px;z-index:19;width:min(320px,calc(100vw - 32px));background:#fff9ef;border:1px solid #d7b66e;border-radius:12px;padding:10px;box-shadow:0 8px 24px rgba(60,40,10,.18)}
.music-player iframe{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px}
.music-player p{margin:8px 2px 2px;font:12px/1.4 Arial,sans-serif;color:#6d5a3c}
@media(max-width:420px){.music-toggle{top:10px;right:10px;padding:9px 11px;font-size:11px}.music-player{top:54px;right:10px;width:min(300px,calc(100vw - 20px))}}

</style>
</head>
<body data-music-autoplay="true">
<main class="cover">
<button class="music-toggle" id="musicToggle" type="button" aria-expanded="false" aria-label="Open wedding music player">
  <span aria-hidden="true">♫</span><span id="musicLabel">Play Music</span>
</button>
<div class="music-player" id="musicPlayer" hidden></div>
  <div class="inner">
    <div class="ornament" aria-hidden="true"><span>•</span><span class="diamond"></span><span>•</span></div>
    <p class="eyebrow">WEDDING INVITATION</p>
    <h1 class="name">Hemanth Kumar B N</h1>
    <p class="amp">&amp;</p>
    <h2 class="name">Rekha M N</h2>
    <div class="rule" aria-hidden="true"></div>
    <p class="date">31 October &amp; 01 November 2026</p>
    <p class="venue">Sri Bommalingeshwara Kalyana Mantapa</p>
    <a class="open" href="./invitation.html" aria-label="Open the full wedding invitation">
      <svg class="envelope" viewBox="0 0 36 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5 18 19 33 8.5M5 5h26a2 2 0 0 1 2 2v18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
      <span>OPEN INVITATION</span>
    </a>
  </div>
</main>




<script>
(function(){
  const button=document.getElementById('musicToggle');
  const panel=document.getElementById('musicPlayer');
  const label=document.getElementById('musicLabel');
  const videoId='jEHeUjewkqo';
  function showPlayer(autoplay){
    panel.hidden=false;
    panel.innerHTML='<iframe title="Wedding invitation background audio" src="https://www.youtube-nocookie.com/embed/'+videoId+'?autoplay='+(autoplay?'1':'0')+'&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><p>Music source: YouTube Short shared for this invitation</p>';
    label.textContent='Music Player';
    button.setAttribute('aria-expanded','true');
  }
  button.addEventListener('click',function(){
    if(panel.hidden) showPlayer(true);
    else { panel.hidden=true; panel.innerHTML=''; label.textContent='Play Music'; button.setAttribute('aria-expanded','false'); }
  });
  // Attempt autoplay as soon as this page opens. Browsers may require a tap before sound can play.
  if(document.body.dataset.musicAutoplay==='true') showPlayer(true);
})();
</script>

</body>
</html>
